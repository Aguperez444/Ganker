name: ganker

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: ganker_postgres_prod
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # IMPORTANTE: En producción NO se exponen puertos de Postgres al host (0.0.0.0)
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      ganker_internal:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ganker_backend_prod
    restart: unless-stopped
    # IMPORTANTE: En producción NO se expone el puerto 8000 al host; solo Nginx accede por la red interna
    volumes:
      - uploads_prod_data:/app/media
    env_file:
      - path: .env.prod
        required: true
    environment:
      - ENVIRONMENT=production
      - CORS_ORIGINS=${CORS_ORIGINS:-https://gankerweb.app,https://www.gankerweb.app}
      - SEED_DEMO_DATA=false
      - UPLOAD_DIR=/app/media
      - MEDIA_URL=/media
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - FORWARDED_ALLOW_IPS=${GANKER_NGINX_IP:-172.30.0.10}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, sys, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3); sys.exit(0 if response.status == 200 and json.load(response) == {'status': 'ok'} else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ganker_internal
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    logging: *default-logging

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: ganker_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - uploads_prod_data:/var/www/media:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      ganker_internal:
        ipv4_address: ${GANKER_NGINX_IP:-172.30.0.10}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    logging: *default-logging

networks:
  ganker_internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${GANKER_INTERNAL_SUBNET:-172.30.0.0/24}

volumes:
  uploads_prod_data:
  postgres_prod_data:
