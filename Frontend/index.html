  <body>
    <noscript>
      <main>
        <h1>Ganker — Plataforma para Encontrar Equipo, Lobbies y Jugadores</h1>
        <p>
          <strong>Ganker</strong> (https://gankerweb.app) es la plataforma web
          de LFG (Looking For Group) y matchmaking para gamers donde encontrás
          equipo, creás lobbies en tiempo real y conectás con jugadores de
          League of Legends, Valorant, Counter-Strike 2 (CS2), Overwatch 2 y
          más.
        </p>
        <h2>Funcionalidades principales de Ganker</h2>
        <ul>
          <li>
            <strong>Búsqueda de equipos y jugadores:</strong> Filtrá compañeros
            por juego, rol, rango competitivo, región y disponibilidad horaria.
          </li>
          <li>
            <strong>Lobbies y gestión de escuadras en tiempo real:</strong>
            Creá tu equipo, invitá jugadores, administrá el roster y chateá en
            tiempo real desde un único lugar.
          </li>
          <li>
            <strong>Perfiles competitivos verificables:</strong> Configurá un
            perfil por juego con tu rango por rol y tus personajes principales
            ordenados por preferencia.
          </li>
        </ul>
        <p>
          Para utilizar la aplicación interactiva de Ganker, por favor habilitá
          JavaScript en tu navegador.
        </p>
      </main>
    </noscript>
