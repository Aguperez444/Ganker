# Ocultar versión de Nginx en cabeceras y páginas de error
server_tokens off;

# Mapeo dinámico para el handshake de WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ==============================================================================
# Restaurar la IP real del visitante detrás de Cloudflare (IPv4 + IPv6 oficiales)
# Sin esto, $binary_remote_addr sería la IP del nodo de Cloudflare y el
# rate limiter bloquearía a todos los usuarios del sitio al mismo tiempo.
# ==============================================================================
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Enviar únicamente la IP que Nginx verificó: no propagar una cadena aportada
# por el visitante. Uvicorn confía solo en este proxy.

# Limitación de tasa para intentos de inicio de sesión (anti-fuerza bruta por IP real)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

upstream fastapi_app {
    server backend:8000;
    keepalive 32;
}

# ==============================================================================
# Bloque HTTP (Puerto 80): Redirección permanente a HTTPS
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name gankerweb.app www.gankerweb.app;

    return 301 https://gankerweb.app$request_uri;
}

# Redirección opcional de www a dominio raíz en HTTPS para unificar origen
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.gankerweb.app;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://gankerweb.app$request_uri;
}

# ==============================================================================
# Bloque Principal HTTPS (Puerto 443) - Cloudflare Full (Strict)
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gankerweb.app;

    # Certificados SSL (Cloudflare Origin Certificate o Let's Encrypt)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Endurecimiento TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeceras de seguridad HTTP globales
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compresión Gzip para estáticos y JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/rss+xml image/svg+xml;

    client_max_body_size 10M;

    # 0. Bloquear escaneos automatizados de archivos ocultos (.env, .git) y scripts legacy
    # evita que ataques automatizados de bots que buscan vulnerabilidades comunes llenen el log del backend de peticiones pedorras
    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* \.(?:php|asp|aspx|jsp|cgi|env|git|sql|bak|ini|sh)$ {
        return 404;
    }

    # 1. Servir imágenes subidas por usuarios/admins desde el volumen compartido
    location /media/ {
        alias /var/www/media/;
        sendfile on;
        tcp_nopush on;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;

        location ~* \.(?:ico|gif|jpe?g|png|webp|svg)$ {
            add_header Cache-Control "public, no-transform" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
            try_files $uri =404;
        }
    }

    # 2. WebSockets de FastAPI (/api/v1/ws/...)
    location ^~ /api/v1/ws/ {
        proxy_pass http://fastapi_app;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 3. Endpoint de Login con limitación de tasa contra fuerza bruta
    location = /auth/v1/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://fastapi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # 4. API REST FastAPI (/api/v1/... y /auth/v1/...)
    # IMPORTANTE: se enruta explícitamente /auth/v1/ y NO /auth/ genérico,
    # para que /auth/callback/:provider sea resuelto por el SPA de React Router.
    location ~ ^/(api/v1|auth/v1)($|/) {
        proxy_pass http://fastapi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # 5. Cachear assets inmutables compilados por Vite (/assets/*)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 6. Archivos de SEO y Open Graph (servir con Content-Type real o 404 directo, nunca caer en /index.html)
    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    location = /og-banner.png {
        root /usr/share/nginx/html;
        default_type image/png;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, no-transform" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # 7. Frontend React SPA (incluye /auth/callback/:provider, /app/*, etc.)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
