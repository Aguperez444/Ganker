version: '3.8'

services:
  backend:
    build: ./backend
    container_name: fastapi_backend
    volumes:
      - ./backend:/app                # Live-reload de código
      - uploads_data:/app/media     # Volumen compartido
    environment:
      - UPLOAD_DIR=/app/media
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    ports:
      - "8000:8000"                   # Opcional, para debugear directo
    command: uvicorn app.infrastructure.start.main:app --host 0.0.0.0 --port 8000 --reload

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"                       # Todo el equipo accede por http://localhost/
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/media:ro # Solo lectura para Nginx
    depends_on:
      - backend

volumes:
  uploads_data:
