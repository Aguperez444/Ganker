version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: app_db
    ports:
      # Expuesto al host: podés conectarte con DBeaver o DataGrip en localhost:5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fastapi_backend
    volumes:
      - ./backend:/app                # Live-reload de código
      - uploads_data:/app/media     # Volumen compartido de archivos
    environment:
      - UPLOAD_DIR=/app/media
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # Inyecta la URL de Postgres (el host 'db' resuelve por DNS interno de Docker)
      - DATABASE_URL=postgresql+psycopg2://dev_user:dev_password@db:5432/app_db
    ports:
      - "8000:8000"                   # Acceso directo para debugging
    depends_on:
      db:
        condition: service_healthy    # Espera a que Postgres esté listo antes de bootear FastAPI
    command: uvicorn app.infrastructure.start.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./Frontend                 # Ajusta si tu carpeta se llama distinto (e.g. ./client)
    container_name: vite_frontend
    volumes:
      - ./Frontend:/app               # Live-reload del código fuente
      - /app/node_modules             # Evita sobreescribir dependencias con las del host
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost
    ports:
      - "5173:5173"                   # Opcional, para entrar directo si hiciera falta

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"                       # Acceso unificado http://localhost/
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  uploads_data:
  postgres_data:                      # Persistencia de los datos de Postgres
